name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'windows/installer.iss'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux image
        run: docker build -t hwddns-check .
      - name: Test Linux container
        run: |
          for suite in test_app.py test_dns.py test_probe.py; do
            docker run --rm -v "$PWD/tests:/app/tests:ro" hwddns-check python -m unittest discover -s tests -p "$suite" -v
          done

  build:
    needs: linux-check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Bundle desktop app
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name HWddns --collect-all tzdata --collect-all pystray
          --hidden-import six --hidden-import six.moves.urllib.parse
          --add-data "templates:templates" --add-data "static:static"
          windows_launcher.py
      - name: Check bundled app
        shell: pwsh
        run: |
          $bundled = Resolve-Path .\dist\HWddns\HWddns.exe
          $check = Start-Process -FilePath $bundled -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            $errorFile = Join-Path $env:TEMP 'hwddns-self-test-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            exit $check.ExitCode
          }
      - name: Compile installer
        shell: pwsh
        working-directory: windows
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed app
        shell: pwsh
        run: |
          $setup = Resolve-Path .\windows\Output\HWddns-Windows-Setup.exe
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=startup' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\HWddns\HWddns.exe'
          if (!(Test-Path $installed)) { throw "Installed app not found: $installed" }
          $startupKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $startup = (Get-ItemProperty -Path $startupKey -Name HWddns).HWddns
          if ($startup -ne ('"' + $installed + '" --background')) { throw "Startup registration missing or incorrect" }
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:LOCALAPPDATA 'HWddns') -Recurse -Force -ErrorAction SilentlyContinue
          $check = Start-Process -FilePath $installed -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            $errorFile = Join-Path $env:TEMP 'hwddns-self-test-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            exit $check.ExitCode
          }
      - name: Check uninstall startup cleanup
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\HWddns\unins000.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $startupKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $startup = Get-ItemProperty -Path $startupKey -Name HWddns -ErrorAction SilentlyContinue
          if ($startup) { throw "Uninstall did not remove startup entry" }
          $config = Join-Path $env:LOCALAPPDATA 'HWddns\config.env'
          if (!(Test-Path $config)) { throw "Uninstall removed user configuration" }
      - uses: actions/upload-artifact@v7
        with:
          name: HWddns-Windows-Setup
          path: windows/Output/HWddns-Windows-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content windows/installer.iss -Raw), '(?m)^#define MyAppVersion "([^"]+)"')
          if (!$version.Success) { throw "Windows app version not found" }
          $releaseTag = "v" + $version.Groups[1].Value
          if ("${{ github.ref }}" -like "refs/tags/v*" -and "${{ github.ref_name }}" -ne $releaseTag) {
            throw "Release tag does not match Windows app version"
          }
          gh release create $releaseTag "windows/Output/HWddns-Windows-Setup.exe" --target "${{ github.sha }}" --title "HWddns $releaseTag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
